name: sclc
channels:
  - defaults
dependencies:
  - python=3.12.0
  - pip
  # Kept in sync with requirements.txt. torch/torchvision are lower bounds:
  # install the CUDA wheel matching your toolkit from https://pytorch.org.
  - pip:
    - numpy==2.0.1
    - scipy==1.13.1
    - matplotlib==3.10.8
    - Pillow==12.1.1
    - pydicom==2.4.4
    - dicom2nifti==2.4.9
    - scikit-learn>=1.3
    - PyYAML==6.0.3
    - nibabel==5.4.0
    - monai==1.5.2
    - timm==1.0.24
    - yacs>=0.1.8
    - termcolor>=2.4
    - torch>=2.2.0
    - torchvision>=0.17.0
