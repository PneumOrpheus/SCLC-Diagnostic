experiment:
  name: mil_swinv2_tiny_fpn_v2_binary
  notes: >-
    Exploratory binary SCLC-vs-non-SCLC classifier (thesis Results,
    "Exploratory Binary SCLC-vs-NSCLC Result"). Reuses the MIL SwinV2-Tiny
    backbone with the FPN arm and collapses the label space to
    {non-SCLC, SCLC} via label_map. Trained outside the pre-specified
    six-configuration benchmark.

    Loss / monitor choices specific to this binary task:
      - focal loss (gamma=2) instead of class-weighted CE: the weighted sampler
        already provides 50/50 balance, so adding class weights skewed the loss
        and deepened an all-SCLC collapse; focal loss down-weights easy bags and
        keeps the gradient on the hard boundary bags.
      - monitor_metric recall_gated_f1: saves the best macro-F1 epoch subject to
        sclc_recall >= 0.50, keeping P(SCLC) discriminative between the classes.

model_type: mil_swinv2_tiny
mode: finetune

# Binary task: collapse {ADC, SCLC, SCC} -> {non-SCLC, SCLC}.
num_classes: 2
label_map: "0:0,1:1,2:0"
class_names: "non-SCLC,SCLC"
valid_data_tag: "_binary"

data:
  finetune_dataset: /home/data/TrainingData
  finetune_csv: /home/data/TrainingData/patients_parameters.csv

checkpoints:
  initial_checkpoint: ""
  model_checkpoint: ""
  checkpoint_dir: /home/data/trained_models
  output_dir: results/output

training:
  # Long cosine schedule: the productive zone is the post-unfreeze epochs, so
  # finetune_epochs is extended to keep a meaningful backbone LR throughout it.
  finetune_epochs: 120
  finetune_freeze_backbone_epochs: 45
  finetune_lr: 3.0e-4
  finetune_warmup_epochs: 46
  warmup_start_lr: 1.0e-6
  finetune_backbone_lr_scale: 0.05
  weight_decay: 5.0e-2

  batch_size: 2
  accumulation_steps: 4

  monitor_rolling_window: 7
  # Early stopping effectively disabled: recall_gated_f1 returns 0 whenever
  # sclc_recall < 0.50, so a short patience would fire during early oscillation.
  early_stopping_patience: 120
  monitor_metric: recall_gated_f1
  focal_loss_gamma: 2.0
  class_weights_ce: ""
  seg_loss_weight: 0.0
  bbox_loss_weight: 0.0

  mixup_alpha: 0.3
  strong_augs: true
  bag_dropout: 0.10
  att_entropy_weight: 0.02

system:
  num_workers: 4
  cache_workers: 1
  seed: 42
  disable_amp: false
  testing: false
  clear_cache: false

pipeline_mil:
  img_size_mil: 256
  bag_size: 16
  mil_mode: att
  mil_trans_blocks: 4
  mil_trans_dropout: 0.05
  lung_mask_suffix: _label_lungs.nii.gz
  min_tumor_pixels: 100
  max_slices_per_volume: 8
  tumor_mask_suffix: _label_tc.nii.gz
